# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# If the above line is not correctly displayed, fix your editor first!

general {
    colors = true
    interval = 5
    color_good = "#88C0D0"      # Muted Cyan (instead of Bright Green)
    color_degraded = "#EBCB8B"  # Muted Yellow
    color_bad = "#BF616A"       # Muted Red
    color = "#88C0D0"
}

# order += "spotify"
order += "awair"
order += "volume master"
# order += "net_rate"
order += "wireless _first_"
order += "ethernet _first_"
# order += "cpu_usage"
# order += "disk /"
order += "battery all"
order += "tztime local"

awair {
    # Replace with your device's Local IP
    ip = "192.168.0.82"
    
    # Customize the display format
    # format = "🏠 {temp}°C  💧 {humid}%  ☁️ {co2}ppm"
    format = "{temp}°C {co2} ppm"
    # format = "{co2} ppm"
    
    # Optional: Set colors based on CO2 levels
    # < 800: Good (Green), 800-1200: Degraded (Yellow), > 1200: Bad (Red)
    thresholds = {
        'co2': [
            (0, "good"),
            (1000, "degraded"),
            (1500, "bad")
        ]
    }
}

wireless _first_ {
	# if you use %speed, i3status requires root privileges
        # format_up = " WLAN   %essid (%ip) "
        format_up = "WLAN"
        # format_up = " "
        format_down = ""
        # color_good = '#ffffff'
        # color_degraded = '#ffffff'
        # color_bad = '#ffffff'
}

ethernet _first_ {
	# if you use %speed, i3status requires root privileges
        format_up = "ETH"
        format_down = ""
        # color_good = '#ffffff'
        # color_degraded = '#ffffff'
        # color_bad = '#ffffff'
}

spotify {
	format = "  {title} "
	format_down = ""
	format_stopped = ""
    # color_good = '#ffffff'
    # color_degraded = '#ffffff'
    # color_bad = '#ffffff'
}

volume master {
    format = "  %volume"
    format_muted = " "
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

cpu_usage {
        format = " cpu  %usage "
}

disk "/" {
	prefix_type = decimal
	#format = " ⛁ %percentage_used (U:%used, F:%free) "	
	format = " ⛁ %free "
}

net_rate {
	format_value = "[\?min_length=10 {value:.1f} {unit}]"
	si_units = "True"
	format = "{down}⇣ "# {up}⇡"
        interfaces_blacklist = "lo"
}

battery all {
        format = " %percentage"
        format_down = "No battery"
        last_full_capacity = true
        integer_battery_capacity = true
        status_chr = "⚡ "
        status_bat = "  "
        status_unk = "  "
        status_full = "  "
        low_threshold = 15
        threshold_type = time
}

tztime local {
        # format = " %Y-%m-%d %H:%M:%S "
        format = " %d/%m %H:%M"
}
