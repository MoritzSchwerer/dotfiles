# ~/.tmux/themes/nord-oled.conf
#
# 1. Basic Status Bar (Transparent & Left-aligned)
set -g status-style bg=default,fg="#D8DEE9"  # Nord4 Text
set -g status-justify left                   # Window list starts from the left

# 2. Left Side: Session Name
# We add a trailing " | " to visually separate the Session from the Windows
set -g status-left-length 40
set -g status-left "#[fg=#81A1C1,bold] #S #[fg=#4C566A]|"

# 3. Right Side: Time & Host
set -g status-right-length 40
set -g status-right " #[fg=#81A1C1,bold]#h "

# 4. Window List
# INACTIVE Windows: Dim gray, thin text
set -g window-status-format "#[fg=#4C566A] #I:#W "

# ACTIVE Window: Bright Cyan, Bold, NO solid background
set -g window-status-current-format "#[fg=#88C0D0,bold] #I:#W "

# 5. Pane Borders
set -g pane-border-style fg="#3B4252"
set -g pane-active-border-style fg="#88C0D0"

# 6. Message Bar
set -g message-style bg=default,fg="#88C0D0"
